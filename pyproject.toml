[project]
name = "frankfurter"
version = "1.0.0"
description = "A feature-rich desktop GUI for exploring exchange-rate data via the Frankfurter API"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "customtkinter>=5.2.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "requests>=2.28.0",
    "Pillow>=10.0.0",
    "tkcalendar>=1.6.0",
]
 
[project.scripts]
frankfurter = "main:main"
 
[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"